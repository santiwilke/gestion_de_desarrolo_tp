server {
    listen 80;
    charset utf-8;
    charset_types text/css application/javascript;

    # Archivos de la página (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy: todo lo que empieza con /api/ va al backend por la red interna
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;

        # CORS: permite que un navegador consuma la API
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        # Respuesta rápida a las consultas previas (preflight) del navegador
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
